<!DOCTYPE html>
<html>
<head>
    <title>text</title>
    <style>
        .password-wrapper {
    position: relative;
    display: inline-block;
    width: 100%;
    max-width: 300px;
    }

    .password-wrapper input {
    width: 100%;
    padding: 10px 40px 10px 10px; /* Leave padding on the right for the icon */
    box-sizing: border-box;
    font-size: 16px;
    }

    .password-wrapper button {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    cursor: pointer;
    padding: 0;
    display: flex;
    align-items: center;
    }

    /* Sizing for the offline SVGs */
    .icon {
    width: 20px;
    height: 20px;
    color: #666;
    }

    /* Toggle utility class */
    .hidden {
    display: none;
    }
    </style>
</head>
<body>
    <div class="password-wrapper">
        <input type="password" id="password" placeholder="Enter your password">
        <button type="button" id="togglePassword" aria-label="Toggle password visibility">
            <!-- Open Eye Icon -->
            <svg class="icon eye-open" xmlns="http://w3.org" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
            </svg>
            <!-- Closed Eye Icon (Hidden by default) -->
            <svg class="icon eye-closed hidden" xmlns="http://w3.org" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 1-4.243-4.243m4.242 4.242L9.88 9.88" />
            </svg>
        </button>
    </div>
    <script>
        const passwordInput = document.getElementById('password');
        const toggleButton = document.getElementById('togglePassword');
        const eyeOpenIcon = toggleButton.querySelector('.eye-open');
        const eyeClosedIcon = toggleButton.querySelector('.eye-closed');

        toggleButton.addEventListener('click', function () {
        // Check the current type and switch it
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            // Swap visibility of the icons
            eyeOpenIcon.classList.add('hidden');
            eyeClosedIcon.classList.remove('hidden');
        } else {
            passwordInput.type = 'password';
            // Swap visibility of the icons back
            eyeOpenIcon.classList.remove('hidden');
            eyeClosedIcon.classList.add('hidden');
        }
        });
    </script>
</body>
</html>
